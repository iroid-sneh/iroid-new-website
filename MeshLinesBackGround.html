<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Lando Minimalist Lines</title>
        <style>
            body {
                margin: 0;
                /* You can change this background to white, red, or any color 
                   and the lines will now sit on top of it */
                background-color: #00024c;
                overflow-x: hidden;
            }
            #canvas-container {
                position: fixed;
                inset: 0;
                z-index: -1;
                pointer-events: none;
            }
            /* TIP: If you want the lines to automatically invert their color 
               to stay visible on both pure white and pure dark backgrounds, 
               uncomment the line below: */
            /* canvas { mix-blend-mode: difference; } */

            .hero {
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                font-family: sans-serif;
                text-transform: uppercase;
                letter-spacing: 10px;
            }
        </style>
    </head>
    <body>
        <div id="canvas-container"></div>

        <section class="hero"></section>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

        <script>
            const _vshader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

            const _fshader = `
            uniform float uTime;
            uniform vec2 uMouse;
            uniform vec2 uResolution;
            varying vec2 vUv;

            vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
            vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
            float snoise(vec3 v){ 
                const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
                const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy) );
                vec3 x0 =   v - i + dot(i, C.xxx) ;
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );
                vec3 x1 = x0 - i1 + 1.0 * C.xxx;
                vec3 x2 = x0 - i2 + 2.0 * C.xxx;
                vec3 x3 = x0 - 1.0 + 3.0 * C.xxx;
                i = mod(i, 289.0 ); 
                vec4 p = permute( permute( permute( 
                         i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                       + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) 
                       + i.y + vec4(0.0, i1.y, i2.y, 1.0 )); 
                float n_ = 1.0/7.0;
                vec3  ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z *ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
            }

            void main() {
                vec2 uv = vUv;
                float ratio = uResolution.x / uResolution.y;
                vec2 noiseUv = vec2(uv.x * ratio, uv.y);

                // Pattern Math (Unchanged as per your request)
                float warp = snoise(vec3(noiseUv * 0.9, uTime * 0.05));
                float n = snoise(vec3(noiseUv * 0.20 + warp * 0.1, uTime * 0.02));

                float density = 14.0;
                float g = fract(n * density);
                
                float thickness = fwidth(n * density) * 1.1; 
                float line = smoothstep(thickness, 0.0, abs(g - 0.5));

                // Line Color
                vec3 lineColor = vec3(0.3, 0.5, 0.9);    

                // We output the color and use the 'line' calculation for alpha transparency
                // 0.2 represents the overall opacity of the lines
                gl_FragColor = vec4(lineColor, line * 0.2);
            }
        `;

            const container = document.getElementById("canvas-container");
            const scene = new THREE.Scene();
            const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

            // 1. Added alpha: true to the renderer
            const renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: true,
            });

            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const uniforms = {
                uTime: { value: 0 },
                uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                uMouse: { value: new THREE.Vector2(0.5, 0.5) },
            };

            const mesh = new THREE.Mesh(
                new THREE.PlaneGeometry(2, 2),
                new THREE.ShaderMaterial({
                    uniforms,
                    vertexShader: _vshader,
                    fragmentShader: _fshader,
                    transparent: true, // 2. Added transparent: true to the material
                })
            );
            scene.add(mesh);

            window.addEventListener("resize", () => {
                renderer.setSize(window.innerWidth, window.innerHeight);
                uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
            });

            window.addEventListener("mousemove", (e) => {
                uniforms.uMouse.value.x = e.clientX / window.innerWidth;
                uniforms.uMouse.value.y = 1.0 - e.clientY / window.innerHeight;
            });

            function animate(time) {
                uniforms.uTime.value = time * 0.001;
                renderer.render(scene, camera);
                requestAnimationFrame(animate);
            }
            animate();
        </script>
    </body>
</html>
