<!doctype html>
<html>
    <head>
        <title>iRoid | Manual Path Studio</title>
        <style>
            body {
                margin: 0;
                overflow: hidden;
                background: #000;
                font-family: sans-serif;
            }
            #ui-hint {
                position: absolute;
                top: 10px;
                left: 10px;
                color: #555;
                pointer-events: none;
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 1px;
            }
        </style>
    </head>
    <body>
        <div id="ui-hint">Manual Spline Editor - Adjust Points to "Sculpt"</div>
        <script type="importmap">
            {
                "imports": {
                    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                    "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm"
                }
            }
        </script>

        <script type="module">
            import * as THREE from "three";
            import { OrbitControls } from "three/addons/controls/OrbitControls.js";
            import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
            import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
            import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
            import GUI from "lil-gui";

            // 1. SETUP
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(
                35,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 0, 10);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.ReinhardToneMapping;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMappingExposure = 1.2;
            document.body.appendChild(renderer.domElement);

            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // 2. THE "MANUAL" PATH POINTS
            // These points define the skeleton of the object.
            // Move these to "draw" the shape manually.
            const pathPoints = [
                new THREE.Vector3(0, 1.2, 2.5),
                new THREE.Vector3(2.5, 0.3, 1.2),
                new THREE.Vector3(1.5, -0.2, -1.5),
                new THREE.Vector3(0, -1.2, -2.5),
                new THREE.Vector3(-1.5, -0.2, -1.5),
                new THREE.Vector3(-2.5, 0.3, 1.2),
                new THREE.Vector3(0, 1.2, 2.5), // close loop
            ];

            const settings = {
                radius: 0.32,
                radialSegments: 8, // smoother
                tubularSegments: 300, // smoother curve
                fresnel: 4.5,
                fiberCount: 220,
                bloom: 2.2,
            };

            // 3. THE SHADER (Matching the reference's high contrast)
            const material = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uFiberCount: { value: settings.fiberCount },
                    uFresnel: { value: settings.fresnel },
                },
                transparent: true,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                vertexShader: `
                    varying vec2 vUv;
                    varying vec3 vNormal;
                    varying vec3 vViewPosition;
                    void main() {
                        vUv = uv;
                        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                        vNormal = normalize(normalMatrix * normal);
                        vViewPosition = -mvPosition.xyz;
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    uniform float uTime;
                    uniform float uFiberCount;
                    uniform float uFresnel;
                    varying vec2 vUv;
                    varying vec3 vNormal;
                    varying vec3 vViewPosition;
                    void main() {
                        vec3 viewDir = normalize(vViewPosition);
                        // Sharp edge glow
                        float fresnel = pow(1.0 - abs(dot(vNormal, viewDir)), uFresnel);
                        
                        // Vertical strands
                        float strands = sin(vUv.y * uFiberCount);
                        strands = smoothstep(0.0, 0.1, strands);

                        // Moving highlight pulses
                        float pulse = sin(vUv.x * 10.0 - uTime * 2.0);
                        pulse = pow(smoothstep(0.5, 1.0, pulse), 4.0);

                        vec3 darkBlue = vec3(0.0, 0.05, 0.3);
                        vec3 brightCyan = vec3(0.0, 0.7, 1.0);
                        
                        vec3 color = darkBlue;
                        color += brightCyan * strands * fresnel * 1.5;
                        color += vec3(1.0) * pulse * strands * fresnel * 2.0; // White highlights

                        gl_FragColor = vec4(color, fresnel * 0.8 + strands * 0.2);
                    }
                `,
            });

            let mesh;
            function rebuildGeometry() {
                if (mesh) scene.remove(mesh);

                // Create the curve from manual points
                const curve = new THREE.CatmullRomCurve3(pathPoints);
                const geo = new THREE.TubeGeometry(
                    curve,
                    settings.tubularSegments,
                    settings.radius,
                    settings.radialSegments,
                    true
                );

                mesh = new THREE.Mesh(geo, material);
                // Position at the bottom like Figma
                mesh.rotation.x = 0.4;
                mesh.rotation.y = -0.3;
                scene.add(mesh);
            }
            rebuildGeometry();

            // 4. POST-PROCESSING
            const composer = new EffectComposer(renderer);
            composer.addPass(new RenderPass(scene, camera));
            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                settings.bloom,
                0.4,
                0.1
            );
            composer.addPass(bloomPass);

            // 5. GUI CONTROLS
            const gui = new GUI({ title: "Manual Spline Studio" });

            // Manual Point Editing
            const pointFolder = gui.addFolder("1. Move Points (Sculpting)");
            pathPoints.forEach((p, i) => {
                if (i === pathPoints.length - 1) return; // Skip closing point
                const f = pointFolder.addFolder("Point " + (i + 1));
                f.add(p, "x", -5, 5).onChange(rebuildGeometry);
                f.add(p, "y", -5, 5).onChange(rebuildGeometry);
                f.add(p, "z", -5, 5).onChange(rebuildGeometry);
            });

            const styleFolder = gui.addFolder("2. Ribbon Style");
            styleFolder.add(settings, "radius", 0.1, 1).name("Thickness").onChange(rebuildGeometry);
            styleFolder
                .add(settings, "radialSegments", 3, 12, 1)
                .name("Ribbon Flatness")
                .onChange(rebuildGeometry);
            styleFolder
                .add(settings, "fresnel", 1, 10)
                .name("Edge Glow Sharpness")
                .onChange((v) => (material.uniforms.uFresnel.value = v));
            styleFolder
                .add(settings, "fiberCount", 50, 400)
                .name("Fiber Density")
                .onChange((v) => (material.uniforms.uFiberCount.value = v));

            gui.add(bloomPass, "strength", 0, 5).name("Bloom (Glow)");
            gui.add(
                {
                    print: () => {
                        console.log("PASTE THESE POINTS IN YOUR CODE:");
                        pathPoints.forEach((p) =>
                            console.log(
                                `new THREE.Vector3(${p.x.toFixed(2)}, ${p.y.toFixed(2)}, ${p.z.toFixed(2)})`
                            )
                        );
                    },
                },
                "print"
            ).name("Save Points to Console");

            // 6. ANIMATE
            function animate() {
                requestAnimationFrame(animate);
                material.uniforms.uTime.value = performance.now() * 0.001;
                controls.update();
                composer.render();
            }
            animate();

            window.addEventListener("resize", () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                composer.setSize(window.innerWidth, window.innerHeight);
            });
        </script>
    </body>
</html>
